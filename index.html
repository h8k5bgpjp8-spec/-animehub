<!DOCTYPE html>

<head>

    <title>Anime Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-top: 20px;
        }
        .subtitle {
            color: #94a3b8;

        }
        .container {
            display: flex;

            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .card h2 {
            color: #f8fafc;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .card p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .join-btn {
            display: inline-block;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .join-btn:hover {
            background-color: #006699;
        }
