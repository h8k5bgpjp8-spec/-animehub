<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .card h2 {
            color: #f8fafc;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .card p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .join-btn {
            display: inline-block;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .join-btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <h1>Anime Hub</h1>
    <p class="subtitle">Join our Telegram Anime Community</p>

    <div class="container">

        <!-- Card 1: Blue Lock -->
        <div class="card">
            <h2>⚽ Blue Lock</h2>
            <p>Join our Blue Lock anime community on Telegram.</p>
            <a href="https://t.me/+YFkGpGn6QggzN2M0" class="join-btn" target="_blank">Join Telegram</a>
        </div>

        <!-- Card 2: One Piece -->
        <div class="card">
            <h2>🏴‍☠️ One Piece</h2>
            <p>One Piece fans chat and anime community.</p>
            <a href="https://t.me/+YFkGpGn6QggzN2M0" class="join-btn" target="_blank">Join Telegram</a>
        </div>

    </div>

</body>
</html>
